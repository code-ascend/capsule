image: docker.io/library/ubuntu:24.04
output: ~/.local/bin/capsule_claude_desktop
compression: zstd
host_exec: true
launch: claude-desktop

install:
  - name: apt repo
    run: |
      apt-get update
      apt-get install -y --no-install-recommends curl ca-certificates gnupg
      curl -fsSLo /usr/share/keyrings/claude-desktop-archive-keyring.asc https://downloads.claude.ai/claude-desktop/key.asc
      echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/claude-desktop-archive-keyring.asc] https://downloads.claude.ai/claude-desktop/apt/stable stable main" > /etc/apt/sources.list.d/claude-desktop.list
  - name: claude-desktop
    run: |
      apt-get update
      apt-get install -y --no-install-recommends claude-desktop
  - name: cleanup
    run: |
      apt-get clean
      rm -rf /var/lib/apt/lists/*

export:
  apps:
    - desktop: /usr/share/applications/com.anthropic.Claude.desktop
      icon: claude-desktop
      name_suffix: " (Capsule)"
  binaries:
    - /usr/bin/claude-desktop
